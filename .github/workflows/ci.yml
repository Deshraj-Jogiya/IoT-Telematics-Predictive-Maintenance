name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run the real pipeline end-to-end (micro-batch telemetry + RUL model + dashboard)
        run: |
          python etl/telemetry_pipeline.py
          python models/predictive_maintenance.py
          python viz/dashboard_export.py
      - name: Run the Jax-accelerated health-decay tests
        run: python -m pytest tests/test_jax_health_decay.py -v
